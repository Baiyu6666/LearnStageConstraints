name: stage_cons_iiwa14

services:
  iiwa14:
    image: baiyu/stage_cons_iiwa14:noetic
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
      args:
        USER_UID: ${USER_UID:?USER_UID must match the host UID; rebuild from the GUI or export USER_UID first}
        KUKA_FRI_REF: ${KUKA_FRI_REF:-59af82a8524b37e08a1424a50605e7fe70f11ec9}
    container_name: stage_cons_iiwa14
    hostname: stage-cons-iiwa14
    init: true
    privileged: true
    cap_add:
      - SYS_NICE
    tty: true
    stdin_open: true
    network_mode: host
    environment:
      ROS_IP: 127.0.0.1
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROBOT_PROFILE: ${ROBOT_PROFILE:-iiwa14}
      SITE_PROFILE: ${SITE_PROFILE:-lab_iiwa14}
      RUNTIME_CONFIG_ROOT: /runtime_profiles
      SCENE_POSE_SOURCE: ${SCENE_POSE_SOURCE:-fixed}
      DISABLE_ROS1_EOL_WARNINGS: "1"
    volumes:
      - ./data/demos:/data/demos
      - ./data/real_runs:/data/real_runs
      - ./data/models:/models:ro
      - ./config/runtime:/runtime_profiles:ro
      - ./config/runtime/sites/${SITE_PROFILE:-lab_iiwa14}/tasks:/task_definitions:ro
      - ./config/runtime/sites/${SITE_PROFILE:-lab_iiwa14}:/workcell_definition:ro
      - ../../outputs:/learned_constraints:ro
